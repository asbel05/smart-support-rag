<div class="layout">
  <header class="header">
    <div class="header-inner">
      <h1 class="app-title">Soporte de Políticas</h1>
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="isSeeding()"
        (click)="onSeedPolicies()">
        {{ isSeeding() ? 'Cargando...' : 'Cargar políticas base' }}
      </button>
    </div>
  </header>

  <main class="container">
    <nav class="tabs" aria-label="Secciones">
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'ask'"
        (click)="selectTab('ask')">
        Consultar
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'search'"
        (click)="selectTab('search')">
        Buscar fragmentos
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'ingest'"
        (click)="selectTab('ingest')">
        Nueva política
      </button>
    </nav>

    @if (statusMessage()) {
      <div class="notice notice-success">{{ statusMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="notice notice-error">{{ errorMessage() }}</div>
    }

    @if (activeTab() === 'ask') {
      <app-ask-support />
    } @else if (activeTab() === 'search') {
      <app-search-policies />
    } @else {
      <app-ingest-policy />
    }
  </main>
</div>
